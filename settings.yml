Svg_icons: 
  type: 'list'
  list_type: 'compact'
  default: 'align-center|align-right|align-justify|strikethrough|underline|indent|table-columns|superscript|subscript|highlighter'
  description: 
    en: "Include FontAwesome 6 icon classes for each icon used in the list."

underline_button_position:
  type: enum
  default: toolbar
  choices:
    - toolbar
    - menu
    - hidden
  description:
    en: "Where to show the underline button: toolbar, the + options menu, or hidden. Applies on desktop and mobile."

